<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>化学实验资源管理</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f4ef;
      --panel: #ffffff;
      --text: #171717;
      --muted: #686868;
      --line: #ddd3c7;
      --accent: #6f55d9;
      --danger: #b3261e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main {
      width: min(1120px, calc(100% - 32px));
      margin: 28px auto 48px;
    }
    h1 { margin: 0 0 20px; font-size: 28px; }
    h2 { margin: 0 0 16px; font-size: 20px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="file"], input[type="text"], select, textarea {
      min-width: 280px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      font: inherit;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
    }
    button, .link-button {
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      padding: 9px 14px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    button.secondary, .link-button.secondary { background: #555; }
    button.danger { background: var(--danger); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 14px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 10px 8px;
      text-align: left;
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; }
    .status {
      margin-top: 10px;
      min-height: 22px;
      color: var(--muted);
    }
    .error { color: var(--danger); }
    .empty { color: var(--muted); padding: 14px 0; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .file-list { display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
<main>
  <h1>化学实验资源管理</h1>

  <section class="panel">
    <h2>演示视频</h2>
    <form id="videoForm" class="row">
      <label style="font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;">
        实验：
        <select id="videoExperiment" name="experiment_type" required>
          <option value="distillation">减压蒸馏</option>
          <option value="photometer">光度计</option>
          <option value="electrolysis">电解实验</option>
        </select>
      </label>
      <input id="videoFile" name="video" type="file" accept="video/mp4" required>
      <button type="submit">上传视频</button>
      <button type="button" class="secondary" id="refreshVideos">刷新</button>
    </form>
    <div style="margin-top:6px;font-size:13px;color:var(--muted);">支持 mp4 格式，单文件最大 100MB；上传后保存到所选实验的视频目录。</div>
    <div id="videoStatus" class="status"></div>
    <div id="videoList"></div>
    <div id="videoPlayer" hidden style="margin-top:16px;">
      <video id="previewVideo" controls style="width:100%;max-height:480px;border-radius:6px;background:#000;"></video>
    </div>
  </section>

  <section class="panel">
    <h2>实验记录</h2>
    <div class="row">
      <button type="button" class="secondary" id="refreshRecords">刷新记录</button>
      <label style="font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;">
        日期筛选：<input type="date" id="recordDateFilter" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;">
      </label>
    </div>
    <div id="recordStatus" class="status"></div>
    <div id="recordList"></div>
  </section>

  <section class="panel">
    <h2>实验录像</h2>
    <div class="row">
      <button type="button" class="secondary" id="refreshRecordVideos">刷新录像</button>
      <label style="font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;">
        日期筛选：<input type="date" id="recordVideoDateFilter" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;">
      </label>
    </div>
    <div id="recordVideoStatus" class="status"></div>
    <div id="recordVideoList"></div>
  </section>

  <section class="panel">
    <h2>拍摄照片</h2>
    <div class="row">
      <button type="button" class="secondary" id="refreshPhotos">刷新照片</button>
      <label style="font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;">
        日期筛选：<input type="date" id="photoDateFilter" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;">
      </label>
    </div>
    <div id="photoStatus" class="status"></div>
    <div id="photoList"></div>
  </section>

  <section class="panel">
    <h2>意见反馈</h2>
    <form id="feedbackForm">
      <div class="row">
        <input id="feedbackTitle" name="title" type="text" maxlength="120" placeholder="标题" required>
        <button type="submit">提交意见</button>
        <button type="button" class="secondary" id="refreshFeedback">刷新意见</button>
      </div>
      <div style="margin-top:12px;">
        <textarea id="feedbackContent" name="content" maxlength="5000" placeholder="请写下意见或问题" required></textarea>
      </div>
    </form>
    <div id="feedbackStatus" class="status"></div>
    <div id="feedbackList"></div>
  </section>
</main>

<script>
const RECORD_API_PREFIX = {{ record_api_prefix|tojson }};
document.title = {{ portal_title|tojson }};
document.querySelector('main > h1').textContent = {{ portal_title|tojson }};
const videoStatus = document.getElementById('videoStatus');
const recordStatus = document.getElementById('recordStatus');
const recordVideoStatus = document.getElementById('recordVideoStatus');
const photoStatus = document.getElementById('photoStatus');
const feedbackStatus = document.getElementById('feedbackStatus');

function setStatus(el, text, isError = false) {
  el.textContent = text || '';
  el.classList.toggle('error', Boolean(isError));
}

function formatSize(bytes) {
  if (!bytes && bytes !== 0) return '';
  const units = ['B', 'KB', 'MB', 'GB'];
  let value = Number(bytes);
  let index = 0;
  while (value >= 1024 && index < units.length - 1) {
    value /= 1024;
    index += 1;
  }
  return `${value.toFixed(index === 0 ? 0 : 1)} ${units[index]}`;
}

async function fetchJson(url, options = {}) {
  const response = await fetch(url, options);
  const text = await response.text();
  let payload = {};
  if (text) {
    try { payload = JSON.parse(text); } catch (_) { payload = { error: text }; }
  }
  if (!response.ok) {
    throw new Error(payload.error || `HTTP ${response.status}`);
  }
  return payload;
}

async function loadVideos() {
  const experiment = document.getElementById('videoExperiment').value;
  setStatus(videoStatus, '正在加载视频...');
  try {
    const data = await fetchJson(`/admin/api/demo/videos?experiment_type=${encodeURIComponent(experiment)}`);
    const videos = data.videos || [];
    if (!videos.length) {
      document.getElementById('videoList').innerHTML = '<div class="empty">还没有演示视频。</div>';
    } else {
      document.getElementById('videoList').innerHTML = `
        <table>
          <thead><tr><th>视频</th><th>实验</th><th>大小</th><th>操作</th></tr></thead>
          <tbody>
            ${videos.map(video => `
              <tr>
                <td>${escapeHtml(video.label || video.filename)}</td>
                <td>${escapeHtml(video.experiment_label || video.experiment_type || '')}</td>
                <td>${formatSize(video.size)}</td>
                <td>
                  <div class="actions">
                    <button class="secondary" data-preview-video="${escapeAttr(video.id)}">预览</button>
                    <a class="link-button secondary" href="/admin/api/demo/videos/${encodeURIComponent(video.id)}/download">下载</a>
                    <button class="danger" data-delete-video="${escapeAttr(video.id)}">删除</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>`;
    }
    const experimentLabel = document.getElementById('videoExperiment').selectedOptions[0]?.textContent || '';
    setStatus(videoStatus, `${experimentLabel}：共 ${videos.length} 个视频。`);
  } catch (error) {
    setStatus(videoStatus, error.message, true);
  }
}

let allRecords = [];

async function loadRecords() {
  setStatus(recordStatus, '正在加载记录...');
  try {
    const data = await fetchJson(`${RECORD_API_PREFIX}/records`);
    allRecords = data.records || [];
    renderRecords();
    renderRecordVideos();
    const audioRecordCount = allRecords.filter(record =>
      (record.files || []).some(file => !isRecordVideo(file))
    ).length;
    const videoCount = allRecords.reduce((count, record) =>
      count + (record.files || []).filter(isRecordVideo).length, 0
    );
    setStatus(recordStatus, `共 ${audioRecordCount} 条音频记录；${videoCount} 个实验录像。`);
  } catch (error) {
    setStatus(recordStatus, error.message, true);
    setStatus(recordVideoStatus, error.message, true);
  }
}

function isRecordVideo(file) {
  return /\.mp4$/i.test((file && file.filename) || '');
}

function recordsForDate(filterId) {
  const filterDate = document.getElementById(filterId).value;
  if (!filterDate) return allRecords;
  return allRecords.filter(record => (record.created_at || '').startsWith(filterDate));
}

function renderRecords() {
  const filterDate = document.getElementById('recordDateFilter').value;
  const records = recordsForDate('recordDateFilter')
    .map(record => ({
      ...record,
      files: (record.files || []).filter(file => !isRecordVideo(file)),
    }))
    .filter(record => record.files.length);
  if (!records.length) {
    document.getElementById('recordList').innerHTML = `<div class="empty">${filterDate ? '该日期没有音频记录。' : '还没有上传的音频记录。'}</div>`;
  } else {
    document.getElementById('recordList').innerHTML = `
      <table>
        <thead><tr><th>记录</th><th>设备/实验</th><th>文件</th><th>操作</th></tr></thead>
        <tbody>
          ${records.map(record => `
            <tr>
              <td>
                <div>${escapeHtml(record.record_id)}</div>
                <div>${escapeHtml(record.created_at || '')}</div>
              </td>
              <td>
                <div>${escapeHtml(record.device_id || '')}</div>
                <div>${escapeHtml(record.experiment_type || '')}</div>
              </td>
              <td>
                <div class="file-list">
                  ${(record.files || []).map(file => `
                    <a class="link-button secondary" href="${escapeAttr(file.download_url)}">${escapeHtml(file.filename)} (${formatSize(file.size)})</a>
                  `).join('')}
                </div>
                ${renderAnalysis(record.analysis)}
              </td>
              <td><button class="danger" data-delete-record="${escapeAttr(record.record_id)}">删除</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  }
}

function renderRecordVideos() {
  const filterDate = document.getElementById('recordVideoDateFilter').value;
  const videos = [];
  recordsForDate('recordVideoDateFilter').forEach(record => {
    (record.files || []).filter(isRecordVideo).forEach(file => videos.push({ record, file }));
  });
  setStatus(recordVideoStatus, `${filterDate ? `${filterDate}：` : ''}共 ${videos.length} 个实验录像。`);
  if (!videos.length) {
    document.getElementById('recordVideoList').innerHTML =
      `<div class="empty">${filterDate ? '该日期没有实验录像。' : '还没有上传的实验录像。'}</div>`;
    return;
  }
  document.getElementById('recordVideoList').innerHTML = `
    <table>
      <thead><tr><th>预览</th><th>时间</th><th>设备/实验</th><th>文件</th><th>操作</th></tr></thead>
      <tbody>
        ${videos.map(({ record, file }) => `
          <tr>
            <td>
              <video controls preload="metadata" src="${escapeAttr(file.file_url)}"
                     style="width:240px;max-height:140px;background:#111;border-radius:4px;"></video>
            </td>
            <td>
              <div>${escapeHtml(record.created_at || '')}</div>
              <div>${escapeHtml(record.record_id || '')}</div>
            </td>
            <td>
              <div>${escapeHtml(record.device_id || '')}</div>
              <div>${escapeHtml(record.experiment_type || '')}</div>
            </td>
            <td>${escapeHtml(file.filename)} (${formatSize(file.size)})</td>
            <td>
              <div class="actions">
                <a class="link-button secondary" href="${escapeAttr(file.download_url)}">下载</a>
                <button class="danger" data-delete-record="${escapeAttr(record.record_id)}">删除整条记录</button>
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

let allPhotos = [];

async function loadPhotos() {
  setStatus(photoStatus, '正在加载照片...');
  try {
    const data = await fetchJson(`${RECORD_API_PREFIX}/photos`);
    allPhotos = data.photos || [];
    renderPhotos();
    setStatus(photoStatus, `共 ${allPhotos.length} 张照片。`);
  } catch (error) {
    setStatus(photoStatus, error.message, true);
  }
}

function renderPhotos() {
  const filterDate = document.getElementById('photoDateFilter').value;
  let photos = allPhotos;
  if (filterDate) {
    photos = allPhotos.filter(photo => (photo.created_at || '').startsWith(filterDate));
  }
  if (!photos.length) {
    document.getElementById('photoList').innerHTML =
      `<div class="empty">${filterDate ? '该日期没有照片。' : '还没有上传的照片。'}</div>`;
    return;
  }
  document.getElementById('photoList').innerHTML = `
    <table>
      <thead><tr><th>预览</th><th>时间</th><th>设备/实验</th><th>操作</th></tr></thead>
      <tbody>
        ${photos.map(photo => `
          <tr>
            <td>
              <a href="${escapeAttr(photo.file_url)}" target="_blank" rel="noopener">
                <img src="${escapeAttr(photo.file_url)}" alt="拍摄照片"
                     style="width:160px;max-height:100px;object-fit:contain;background:#111;border-radius:4px;">
              </a>
            </td>
            <td>
              <div>${escapeHtml(photo.created_at || '')}</div>
              <div>${escapeHtml(photo.photo_id || '')}</div>
            </td>
            <td>
              <div>${escapeHtml(photo.device_id || '')}</div>
              <div>${escapeHtml(photo.experiment_type || '')}</div>
              ${renderAnalysis(photo.analysis)}
            </td>
            <td>
              <div class="actions">
                <a class="link-button secondary" href="${escapeAttr(photo.download_url)}">下载</a>
                <button class="danger" data-delete-photo="${escapeAttr(photo.photo_id)}">删除</button>
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

async function loadFeedback() {
  setStatus(feedbackStatus, '正在加载意见...');
  try {
    const data = await fetchJson('/admin/api/feedback');
    const feedback = data.feedback || [];
    if (!feedback.length) {
      document.getElementById('feedbackList').innerHTML = '<div class="empty">还没有意见。</div>';
    } else {
      document.getElementById('feedbackList').innerHTML = `
        <table>
          <thead><tr><th>时间</th><th>标题</th><th>意见内容</th><th>操作</th></tr></thead>
          <tbody>
            ${feedback.map(item => `
              <tr>
                <td>${escapeHtml(item.created_at || '')}</td>
                <td>${escapeHtml(item.title || '')}</td>
                <td style="white-space:pre-wrap;">${escapeHtml(item.content || '')}</td>
                <td><button class="danger" data-delete-feedback="${escapeAttr(item.feedback_id)}">删除</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>`;
    }
    setStatus(feedbackStatus, `共 ${feedback.length} 条意见。`);
  } catch (error) {
    setStatus(feedbackStatus, error.message, true);
  }
}

document.getElementById('videoForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const fileInput = document.getElementById('videoFile');
  if (!fileInput.files.length) return;
  const formData = new FormData();
  formData.append('experiment_type', document.getElementById('videoExperiment').value);
  formData.append('video', fileInput.files[0]);
  setStatus(videoStatus, '正在上传视频...');
  try {
    await fetchJson('/admin/api/demo/videos', { method: 'POST', body: formData });
    fileInput.value = '';
    setStatus(videoStatus, '上传完成。');
    await loadVideos();
  } catch (error) {
    setStatus(videoStatus, error.message, true);
  }
});

document.getElementById('feedbackForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const titleInput = document.getElementById('feedbackTitle');
  const contentInput = document.getElementById('feedbackContent');
  const title = titleInput.value.trim();
  const content = contentInput.value.trim();
  if (!title || !content) {
    setStatus(feedbackStatus, '标题和意见内容都需要填写。', true);
    return;
  }
  setStatus(feedbackStatus, '正在提交意见...');
  try {
    await fetchJson('/admin/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, content }),
    });
    titleInput.value = '';
    contentInput.value = '';
    setStatus(feedbackStatus, '意见已提交。');
    await loadFeedback();
  } catch (error) {
    setStatus(feedbackStatus, error.message, true);
  }
});

document.addEventListener('click', async (event) => {
  const previewId = event.target.dataset && event.target.dataset.previewVideo;
  if (previewId) {
    const player = document.getElementById('videoPlayer');
    const video = document.getElementById('previewVideo');
    const url = `/admin/api/demo/videos/${encodeURIComponent(previewId)}/download`;
    if (!player.hidden && video.src.includes(encodeURIComponent(previewId))) {
      video.pause();
      player.hidden = true;
    } else {
      video.src = url;
      player.hidden = false;
      video.play();
    }
  }
  const videoId = event.target.dataset && event.target.dataset.deleteVideo;
  if (videoId) {
    if (!confirm('确定删除这个视频吗？')) return;
    try {
      await fetchJson(`/admin/api/demo/videos/${encodeURIComponent(videoId)}`, { method: 'DELETE' });
      await loadVideos();
    } catch (error) {
      setStatus(videoStatus, error.message, true);
    }
  }
  const recordId = event.target.dataset && event.target.dataset.deleteRecord;
  if (recordId) {
    if (!confirm('确定删除这条记录吗？')) return;
    try {
      await fetchJson(`${RECORD_API_PREFIX}/records/${encodeURIComponent(recordId)}`, { method: 'DELETE' });
      await loadRecords();
    } catch (error) {
      setStatus(recordStatus, error.message, true);
    }
  }
  const photoId = event.target.dataset && event.target.dataset.deletePhoto;
  if (photoId) {
    if (!confirm('确定删除这张照片吗？')) return;
    try {
      await fetchJson(`${RECORD_API_PREFIX}/photos/${encodeURIComponent(photoId)}`, { method: 'DELETE' });
      await loadPhotos();
    } catch (error) {
      setStatus(photoStatus, error.message, true);
    }
  }
  const feedbackId = event.target.dataset && event.target.dataset.deleteFeedback;
  if (feedbackId) {
    if (!confirm('确定删除这条意见吗？')) return;
    try {
      await fetchJson(`/admin/api/feedback/${encodeURIComponent(feedbackId)}`, { method: 'DELETE' });
      await loadFeedback();
    } catch (error) {
      setStatus(feedbackStatus, error.message, true);
    }
  }
});

document.getElementById('refreshVideos').addEventListener('click', loadVideos);
document.getElementById('videoExperiment').addEventListener('change', loadVideos);
document.getElementById('refreshRecords').addEventListener('click', loadRecords);
document.getElementById('recordDateFilter').addEventListener('change', renderRecords);
document.getElementById('refreshRecordVideos').addEventListener('click', loadRecords);
document.getElementById('recordVideoDateFilter').addEventListener('change', renderRecordVideos);
document.getElementById('refreshPhotos').addEventListener('click', loadPhotos);
document.getElementById('photoDateFilter').addEventListener('change', renderPhotos);
document.getElementById('refreshFeedback').addEventListener('click', loadFeedback);

function escapeHtml(value) {
  return String(value || '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function escapeAttr(value) {
  return escapeHtml(value);
}

function renderAnalysis(analysis) {
  const items = Object.values((analysis && analysis.items) || {});
  if (!items.length) return '';
  const lines = items.map(item => {
    if (item.status === 'queued') return '分析排队中';
    if (item.status === 'running') return '正在分析';
    if (item.status === 'failed') return `分析失败：${item.error || '未知错误'}`;
    if (item.transcript) return `转写：${item.transcript}`;
    if (item.description) return `图片描述：${item.description}`;
    return '';
  }).filter(Boolean);
  if (!lines.length) return '';
  return `<div style="margin-top:8px;font-size:13px;color:var(--muted);white-space:pre-wrap;">${lines.map(escapeHtml).join('<br>')}</div>`;
}

loadVideos();
loadRecords();
loadPhotos();
loadFeedback();
</script>
</body>
</html>
