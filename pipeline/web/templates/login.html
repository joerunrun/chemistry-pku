<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="csrf-token" content="{{ csrf_token() }}">
        <script src="{{ url_for('static', filename='security.js') }}"></script>
        <base href="{{ url_for('static', filename='fluid/') }}">
        <meta http-equiv="Cache-Control" content="no-cache">

        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">

        <link rel="apple-touch-icon" href="logo.png">
        <link rel="icon" href="logo.png">

        <title>北京大学统一认证</title>
        <meta name="description" content="A WebGL fluid simulation that works in mobile browsers.">

        <meta property="og:type" content="website">
        <meta property="og:title" content="Webgl Fluid Simulation">
        <meta property="og:description" content="A WebGL fluid simulation that works in mobile browsers.">
        <meta property="og:url" content="https://paveldogreat.github.io/WebGL-Fluid-Simulation/">
        <meta property="og:image" content="https://paveldogreat.github.io/WebGL-Fluid-Simulation/logo.png">

        <script type="text/javascript" src="dat.gui.min.js"></script>
        <style>
            @font-face {
                font-family: 'iconfont';
                src: url('iconfont.ttf') format('truetype');
            }

            * {
                user-select: none;
            }

            html, body {
                overflow: hidden;
                background-color: #000;
            }

            body {
                margin: 0;
                position: fixed;
                width: 100%;
                height: 100%;
            }

            canvas {
                width: 100%;
                height: 100%;
            }

            .dg {
                display: none !important;
            }

            .dg .property-name {
                overflow: visible;
            }

            .bigFont {
                font-size: 150%;
                color: #8C8C8C;
            }

            .cr.function.appBigFont {
                font-size: 150%;
                line-height: 27px;
                color: #A5F8D3;
                background-color: #023C40;
            }

            .cr.function.appBigFont .property-name {
                float: none;
            }

            .cr.function.appBigFont .icon {
                position: sticky;
                bottom: 27px;
            }

            .icon {
                font-family: 'iconfont';
                font-size: 130%;
                float: right;
            }

            .twitter:before {
                content: 'a';
            }

            .github:before {
                content: 'b';
            }

            .app:before {
                content: 'c';
            }

            .discord:before {
                content: 'd';
            }

            .promo {
                display: none !important;
                /* display: table; */
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
                overflow: auto;
                color: lightblue;
                background-color: rgba(0,0,0,0.4);
                animation: promo-appear-animation 0.35s ease-out;
            }

            .promo-middle {
                display: table-cell;
                vertical-align: middle;
            }

            .promo-content {
                width: 80vw;
                height: 80vh;
                max-width: 80vh;
                max-height: 80vw;
                margin: auto;
                padding: 0;
                font-size: 2.8vmax;
                font-family: Futura, "Trebuchet MS", Arial, sans-serif;
                text-align: center;
                background-image: url("promo_back.png");
                background-position: center;
                background-repeat: no-repeat;
                background-size: cover;
                border-radius: 15px;
                box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);
            }

            .promo-header {
                height: 10%;
                padding: 2px 16px;
            }

            .promo-close {
                width: 10%;
                height: 100%;
                text-align: left;
                float: left;
                font-size: 1.3em;
                /* transition: 0.2s; */
            }

            .promo-close:hover {
                /* transform: scale(1.25); */
                cursor: pointer;
            }

            .promo-body {
                padding: 8px 16px 16px 16px;
                margin: auto;
            }

            .promo-body p {
                margin-top: 0;
                mix-blend-mode: color-dodge;
            }

            .link {
                width: 100%;
                display: inline-block;
            }

            .link img {
                width: 100%;
            }

            @keyframes promo-appear-animation {
                0% {
                    transform: scale(2.0);
                    opacity: 0;
                }
                100% {
                    transform: scale(1.0);
                    opacity: 1;
                }
            }
            .portal-entry {
                position: absolute;
                top: 22px;
                right: 24px;
                z-index: 3;
            }

            .portal-entry button {
                min-height: 38px;
                padding: 0 16px;
                border: 1px solid rgba(255, 255, 255, 0.45);
                border-radius: 999px;
                color: #fff;
                background: rgba(0, 0, 0, 0.28);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                font: 500 13px/1 "Microsoft YaHei", system-ui, sans-serif;
                cursor: pointer;
            }

            .portal-entry button:hover {
                background: rgba(0, 0, 0, 0.5);
                border-color: #fff;
            }

            .portal-entry button:disabled {
                opacity: 0.55;
                cursor: not-allowed;
            }

            .admin-entry {
                position: absolute;
                right: 28px;
                bottom: 22px;
                z-index: 3;
                border: 0;
                background: transparent;
                color: rgba(255,255,255,.72);
                font: 12px/1 "Microsoft YaHei", system-ui, sans-serif;
                cursor: pointer;
            }

            .admin-entry:hover { color: #fff; }

            .admin-modal {
                position: fixed;
                inset: 0;
                z-index: 10;
                display: none;
                place-items: center;
                padding: 20px;
                background: rgba(0, 0, 0, .56);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }

            .admin-modal.open { display: grid; }

            .admin-dialog {
                width: min(360px, calc(100vw - 40px));
                padding: 24px;
                border: 1px solid rgba(255, 255, 255, .2);
                border-radius: 18px;
                color: #fff;
                background: rgba(7, 17, 28, .88);
                box-shadow: 0 24px 70px rgba(0, 0, 0, .45);
                font-family: "Microsoft YaHei", system-ui, sans-serif;
            }

            .admin-dialog h2 { margin: 0 0 8px; font-size: 20px; }
            .admin-dialog p { margin: 0 0 18px; color: rgba(255,255,255,.66); font-size: 13px; }
            .admin-dialog input {
                box-sizing: border-box;
                width: 100%;
                padding: 12px 14px;
                border: 1px solid rgba(255,255,255,.24);
                border-radius: 10px;
                color: #fff;
                background: rgba(0,0,0,.35);
                font: 14px "Microsoft YaHei", system-ui, sans-serif;
                user-select: text;
            }
            .admin-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
            .admin-actions button { padding: 10px 16px; border: 0; border-radius: 10px; cursor: pointer; }
            .admin-actions .cancel { color: #fff; background: rgba(255,255,255,.12); }
            .admin-actions .submit { color: #00151a; background: #65e4df; font-weight: 700; }
            .admin-error { min-height: 18px; margin-top: 10px; color: #ffaaa5; font-size: 13px; }

            @media (max-width: 600px) {
                .portal-entry {
                    top: auto;
                    right: 50%;
                    bottom: 22px;
                    transform: translateX(50%);
                }
            }
        </style>
        <script>
            window.ga = function () {};
        </script>
    </head>
    <body>
        <canvas></canvas>

        <form class="portal-entry"
              {% if pku_redirect_url %}
              action="https://iaaa.pku.edu.cn/iaaa/oauth.jsp" method="post"
              {% else %}
              onsubmit="return false"
              {% endif %}>
            <input name="appID" type="hidden" value="{{ pku_app_id }}">
            <input name="redirectUrl" type="hidden" value="{{ pku_redirect_url }}">
            <button type="{% if pku_redirect_url %}submit{% else %}button{% endif %}"
                    {% if not pku_redirect_url %}disabled title="请先配置北大 IAAA 已登记的回调地址"{% endif %}>
                进入北大门户登录
            </button>
        </form>
        <button id="openAdmin" class="admin-entry" type="button">管理员入口</button>

        <div id="adminModal" class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
            <form id="adminForm" class="admin-dialog">
                <h2 id="adminTitle">管理员登录</h2>
                <p>输入管理员密码，进入同一个化小北工作台。</p>
                <input id="adminPassword" type="password" autocomplete="current-password" placeholder="管理员密码" required>
                <div id="adminError" class="admin-error" aria-live="polite"></div>
                <div class="admin-actions">
                    <button id="closeAdmin" class="cancel" type="button">取消</button>
                    <button class="submit" type="submit">进入工作台</button>
                </div>
            </form>
        </div>

        <!-- Mother of God, pls forgive me -->
        <div class="promo">
            <div class="promo-middle">
                <div class="promo-content">
                    <div class="promo-header">
                        <span class="promo-close">&times;</span>
                    </div>
                    <div class="promo-body">
                        <p>Try Fluid Simulation app!</p>
                        <div class="links-container">
                            <a class="link" id="apple_link" target="_blank">
                                <img class="link-img" alt="Download on the App Store" src="app_badge.png"/>
                            </a>
                            <a class="link" id="google_link" target="_blank">
                                <img class="link-img" alt="Get it on Google Play" src="gp_badge.png"/>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="./script.js"></script>
        <script src="{{ url_for('static', filename='pku-callback.js') }}"></script>
        <script>
            (() => {
                const modal = document.getElementById('adminModal');
                const form = document.getElementById('adminForm');
                const password = document.getElementById('adminPassword');
                const error = document.getElementById('adminError');
                const open = () => {
                    modal.classList.add('open');
                    error.textContent = '';
                    window.setTimeout(() => password.focus(), 0);
                };
                const close = () => {
                    modal.classList.remove('open');
                    password.value = '';
                    error.textContent = '';
                };
                document.getElementById('openAdmin').addEventListener('click', open);
                document.getElementById('closeAdmin').addEventListener('click', close);
                modal.addEventListener('click', event => { if (event.target === modal) close(); });
                document.addEventListener('keydown', event => { if (event.key === 'Escape') close(); });
                form.addEventListener('submit', async event => {
                    event.preventDefault();
                    error.textContent = '正在验证……';
                    try {
                        const response = await fetch('/auth/admin/login', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({password: password.value}),
                        });
                        if (!response.ok) {
                            const data = await response.json().catch(() => ({}));
                            throw new Error(data.error || `登录失败（${response.status}）`);
                        }
                        window.location.assign(response.url || '/workspace#admin');
                    } catch (reason) {
                        error.textContent = reason.message || '管理员登录失败';
                    }
                });
                if (window.location.hash === '#admin') open();
            })();
        </script>
    </body>
</html>
