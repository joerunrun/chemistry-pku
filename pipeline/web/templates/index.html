<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>化学实验纠错 Pipeline</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1>化学实验纠错 Pipeline</h1>
        <p class="subtle">实验装置纠错 / 实验室安全检查统一入口</p>
      </div>
    </header>

    <section class="panel" style="padding:14px; margin-bottom:14px;">
      <label style="font-weight:700; display:flex; align-items:center; gap:10px;">
        功能模块：
        <select id="moduleType" style="width:220px;font:inherit;border:1px solid var(--line);border-radius:6px;padding:7px 10px;">
          <option value="experiment" selected>实验装置纠错</option>
          <option value="safety">实验室安全检查</option>
        </select>
      </label>
    </section>

    <section id="experimentModule">
      <form id="mainForm" data-module="experiment">
        <!-- 实验选择 -->
        <section class="panel" style="padding:14px; margin-bottom:14px;">
          <label style="font-weight:700; display:flex; align-items:center; gap:10px;">
            实验类型：
            <select name="experiment_type" id="experimentType" style="width:200px;font:inherit;border:1px solid var(--line);border-radius:6px;padding:7px 10px;">
              <option value="distillation" selected>减压蒸馏实验</option>
              <option value="photometer">光度计实验</option>
              <option value="electrolysis">电解实验</option>
            </select>
          </label>
        </section>

        <!-- ====== 实验输入 ====== -->
        <div id="distillationBlock">
          <section class="upload-grid">
            <div class="upload-card panel">
              <label id="wrongInputLabel">待纠错图片（学生图）</label>
              <input type="file" name="wrong_image" accept="image/*" id="wrongInput">
              <img id="wrongPreview" class="upload-preview" hidden alt="学生图预览">
            </div>
            <div class="upload-card panel">
              <label>正确参考图</label>
              <div class="readonly-box" id="referenceDisplay">读取配置中...</div>
              <img id="configuredReferencePreview" class="upload-preview" hidden alt="配置参考图预览">
              <input type="hidden" name="correct_source" id="correctSourceInput" value="database">
              <input type="hidden" name="reference_id" id="referenceIdInput">
            </div>
          </section>

          <section class="panel" style="padding:14px; margin-bottom:14px;">
            <label style="display:block;font-weight:700;margin-bottom:6px;">实验要求</label>
            <div class="readonly-box" id="requirementsDisplay">读取配置中...</div>
            <input type="hidden" name="experiment_requirements" id="requirementsInput">
          </section>

          <details class="config-panel panel" style="margin-bottom:14px;">
            <summary style="font-weight:700;color:var(--accent-dark);cursor:pointer;">CV / VLM 参数</summary>
            <div class="config-grid" style="margin-top:10px;">
              <label>特征 <select name="feature"><option value="akaze" selected>AKAZE</option><option value="sift">SIFT</option></select></label>
              <label>Provider <select name="provider" id="providerSelect"><option value="gemini">Gemini</option><option value="openrouter">OpenRouter</option><option value="ali">阿里云</option><option value="qiniu" selected>七牛云 Gemini</option></select></label>
              <label>模型 <select name="model" id="modelSelect"><option value="">默认</option></select></label>
              <input type="hidden" name="approach" value="a">
              <label>max_side <input type="number" name="max_side" value="1600" min="600" max="2600" step="100"></label>
              <label>lowe_ratio <input type="number" name="lowe_ratio" value="0.75" min="0.5" max="0.95" step="0.05"></label>
              <label>min_good <input type="number" name="min_good_matches" value="3" min="1" max="20"></label>
              <label>min_inliers <input type="number" name="min_inliers" value="2" min="1" max="20"></label>
              <label>inlier_ratio <input type="number" name="min_inlier_ratio" value="0.08" min="0.01" max="0.5" step="0.01"></label>
              <label>top_k <input type="number" name="top_k_per_label" value="6" min="1" max="20"></label>
              <label>overlap_w <input type="number" name="overlap_weight" value="0.75" min="0" max="2" step="0.05"></label>
            </div>
          </details>
        </div>

        <!-- ====== 电解实验输入：检索 + VLM，不走检测框 ====== -->
        <div id="electrolysisBlock" hidden>
          <section class="upload-grid">
            <div class="upload-card panel">
              <label>待纠错图片（电解实验）</label>
              <input type="file" name="image" accept="image/*" id="electrolysisInput">
              <img id="electrolysisPreview" class="upload-preview" hidden alt="电解实验图片预览">
            </div>
            <div class="upload-card panel">
              <label>处理方式</label>
              <div class="readonly-box">从正确/错误样例各检索 1 张参考图，再由 VLM 输出问题和意见。</div>
            </div>
          </section>
        </div>

        <!-- ====== 占位实验 ====== -->
        <div id="placeholderBlock" hidden>
          <section class="panel placeholder" style="margin-bottom:14px;">
            <div style="text-align:center;padding:60px 20px;">
              <h2 id="placeholderTitle">该实验模块尚未实现</h2>
              <p class="subtle" id="placeholderDesc">请选择"减压蒸馏实验"进行演示。</p>
            </div>
          </section>
        </div>

        <div class="action-bar">
          <button type="submit" id="runButton">开始检测</button>
          <span id="status" class="status"></span>
        </div>
      </form>

      <!-- 检测结果（立刻显示） -->
      <section class="results-grid" id="detectArea" data-module="experiment" hidden>
        <section class="images-panel panel">
          <h2>检测/标注结果</h2>
          <div class="image-pair">
            <figure><figcaption>参考图（正确）</figcaption><img id="correctImage" alt="参考图标注"></figure>
            <figure><figcaption>待纠错图</figcaption><img id="wrongImage" alt="待纠错图标注"></figure>
          </div>
        </section>
        <aside class="side">
          <section class="card panel"><h2>检测耗时</h2><table class="timing-table" id="detectTiming"><tbody></tbody></table></section>
          <section class="card panel"><h2>目标检测</h2><table class="timing-table" id="detectionTable"><tbody></tbody></table></section>
        </aside>
      </section>

      <!-- VLM 分析结果（异步显示） -->
      <section id="analyzeArea" data-module="experiment" hidden style="margin-top:14px;">
        <div class="action-bar"><span id="analyzeStatus" class="status">正在 VLM 分析...</span></div>
        <div class="approach-tabs">
          <button type="button" class="approach-tab active" data-tab="tabA">方案A 一步到位</button>
          <button type="button" class="approach-tab" data-tab="tabB" hidden>方案B 两步式</button>
        </div>
        <div id="tabA" class="approach-content active panel" style="padding:14px;">
          <h2>方案A 分析结果</h2><div class="result-text" id="resultA"></div>
        </div>
        <div id="tabB" class="approach-content panel" style="padding:14px;">
          <div class="diff-section"><h3>Step 1: 逐色框找不同</h3><div class="result-text" id="resultBDiff"></div></div>
          <div class="diff-section"><h3>Step 2: 结合实验要求分析</h3><div class="result-text" id="resultBAnalysis"></div></div>
        </div>
        <section class="card panel" style="margin-top:10px;"><h2>VLM 耗时</h2><table class="timing-table" id="analyzeTiming"><tbody></tbody></table></section>
      </section>
    </section>

    <section id="safetyModule" hidden>
    <form id="safetyForm" data-module="safety">
      <section class="upload-grid">
        <div class="upload-card panel">
          <label>待检查图片</label>
          <input type="file" name="image" accept="image/*" id="safetyImageInput">
          <img id="safetyPreview" class="upload-preview" hidden alt="安全检查图片预览">
        </div>
        <div class="upload-card panel">
          <label>安全检查参数</label>
          <div class="config-grid">
            <label>Provider <select name="provider" id="safetyProviderSelect"><option value="gemini">Gemini</option><option value="openrouter">OpenRouter</option><option value="ali">阿里云</option><option value="qiniu" selected>七牛云 Gemini</option></select></label>
            <label>模型 <select name="model" id="safetyModelSelect"><option value="">默认</option></select></label>
            <label>Top-K <input type="number" name="top_k" value="1" min="1" max="10"></label>
          </div>
        </div>
      </section>

      <div class="action-bar">
        <button type="submit" id="safetyRunButton">开始检查</button>
        <span id="safetyStatus" class="status"></span>
      </div>
    </form>

    <section class="results-grid" id="safetyResultsArea" hidden>
      <section class="card panel">
        <h2>安全检查结果</h2>
        <div class="result-text" id="safetyResultText"></div>
      </section>
      <aside class="side">
        <section class="card panel"><h2>耗时</h2><table class="timing-table" id="safetyTiming"><tbody></tbody></table></section>
      </aside>
    </section>
    </section>
  </main>

  <script>
    const moduleType = document.getElementById("moduleType");
    const experimentModule = document.getElementById("experimentModule");
    const safetyModule = document.getElementById("safetyModule");
    const safetyForm = document.getElementById("safetyForm");
    const safetyResultsArea = document.getElementById("safetyResultsArea");

    /* ---- 实验切换 ---- */
    const experimentType = document.getElementById("experimentType");
    const distillationBlock = document.getElementById("distillationBlock");
    const electrolysisBlock = document.getElementById("electrolysisBlock");
    const placeholderBlock = document.getElementById("placeholderBlock");
    const placeholderTitle = document.getElementById("placeholderTitle");
    const placeholderDesc = document.getElementById("placeholderDesc");
    const wrongInputLabel = document.getElementById("wrongInputLabel");
    const referenceDisplay = document.getElementById("referenceDisplay");
    const requirementsDisplay = document.getElementById("requirementsDisplay");
    const configuredReferencePreview = document.getElementById("configuredReferencePreview");
    const correctSourceInput = document.getElementById("correctSourceInput");
    const referenceIdInput = document.getElementById("referenceIdInput");
    const requirementsInput = document.getElementById("requirementsInput");
    let experimentUiConfigs = {};

    const PLACEHOLDERS = {
      electrolysis: { title: "电解实验", desc: "电解实验纠错模块尚未实现，敬请期待。" },
    };

    function applyExperimentConfig() {
      const item = experimentUiConfigs[experimentType.value] || {};
      correctSourceInput.value = item.correct_source || "database";
      referenceIdInput.value = item.reference_id || "";
      requirementsInput.value = item.experiment_requirements || "";

      const refName = item.reference_name || item.reference_id || "未配置";
      referenceDisplay.textContent = refName;
      requirementsDisplay.textContent = item.experiment_requirements || "未配置";
      configuredReferencePreview.hidden = true;
      if (item.reference_id) loadConfiguredReferencePreview(experimentType.value);
    }

    async function loadConfiguredReferencePreview(experimentTypeValue) {
      try {
        const r = await fetch(`/api/config-reference-image?experiment_type=${encodeURIComponent(experimentTypeValue)}`);
        const d = await r.json();
        if (experimentType.value !== experimentTypeValue || !d.data_url) return;
        configuredReferencePreview.src = d.data_url;
        configuredReferencePreview.hidden = false;
      } catch(e) {
        configuredReferencePreview.hidden = true;
      }
    }

    function applyExperimentMode() {
      const val = experimentType.value;
      if (val === "distillation") {
        distillationBlock.hidden = false;
        electrolysisBlock.hidden = true;
        placeholderBlock.hidden = true;
        wrongInputLabel.textContent = "待纠错图片（学生图）";
        applyExperimentConfig();
      } else if (val === "photometer") {
        distillationBlock.hidden = false;
        electrolysisBlock.hidden = true;
        placeholderBlock.hidden = true;
        wrongInputLabel.textContent = "待纠错图片（学生图）";
        applyExperimentConfig();
      } else if (val === "electrolysis") {
        distillationBlock.hidden = true;
        electrolysisBlock.hidden = false;
        placeholderBlock.hidden = true;
      } else {
        distillationBlock.hidden = true;
        electrolysisBlock.hidden = true;
        placeholderBlock.hidden = false;
        const info = PLACEHOLDERS[val] || {};
        placeholderTitle.textContent = info.title || "未实现";
        placeholderDesc.textContent = info.desc || "该实验模块尚未实现。";
      }
    }

    experimentType.addEventListener("change", () => {
      applyExperimentMode();
    });

    /* ---- 蒸馏功能 ---- */
    const wrongInput = document.getElementById("wrongInput");
    const wrongPreview = document.getElementById("wrongPreview");
    const electrolysisInput = document.getElementById("electrolysisInput");
    const electrolysisPreview = document.getElementById("electrolysisPreview");
    const mainForm = document.getElementById("mainForm");
    const runButton = document.getElementById("runButton");
    const statusEl = document.getElementById("status");
    const detectArea = document.getElementById("detectArea");
    const analyzeArea = document.getElementById("analyzeArea");
    const analyzeStatus = document.getElementById("analyzeStatus");
    const safetyRunButton = document.getElementById("safetyRunButton");
    const safetyStatus = document.getElementById("safetyStatus");

    function applyModuleMode() {
      const isSafety = moduleType.value === "safety";
      experimentModule.hidden = isSafety;
      safetyModule.hidden = !isSafety;
      detectArea.hidden = true;
      analyzeArea.hidden = true;
      safetyResultsArea.hidden = true;
      statusEl.textContent = "";
      safetyStatus.textContent = "";
    }

    moduleType.addEventListener("change", applyModuleMode);

    wrongInput.addEventListener("change", () => {
      if (wrongInput.files[0]) {
        wrongPreview.src = URL.createObjectURL(wrongInput.files[0]);
        wrongPreview.hidden = false;
      }
    });

    electrolysisInput.addEventListener("change", () => {
      if (electrolysisInput.files[0]) {
        electrolysisPreview.src = URL.createObjectURL(electrolysisInput.files[0]);
        electrolysisPreview.hidden = false;
      }
    });

    document.getElementById("safetyImageInput").addEventListener("change", function() {
      if (this.files[0]) {
        const p = document.getElementById("safetyPreview");
        p.src = URL.createObjectURL(this.files[0]);
        p.hidden = false;
      }
    });

    async function loadExperimentConfigs() {
      try {
        const r = await fetch("/api/experiment-configs");
        const d = await r.json();
        experimentUiConfigs = d.experiment_configs || {};
      } catch(e) {
        experimentUiConfigs = {};
      }
      applyExperimentMode();
    }
    applyExperimentMode();
    loadExperimentConfigs();

    /* models */
    const providerSelect = document.getElementById("providerSelect");
    const modelSelect = document.getElementById("modelSelect");
    const safetyProviderSelect = document.getElementById("safetyProviderSelect");
    const safetyModelSelect = document.getElementById("safetyModelSelect");
    let providerModels = {};
    function fillModelSelect(providerEl, modelEl) {
      const models = providerModels[providerEl.value] || [];
      modelEl.innerHTML = '<option value="">默认</option>';
      models.forEach(m => {
        const o = document.createElement("option");
        o.value = m.value;
        o.textContent = m.label;
        modelEl.appendChild(o);
      });
      if ((modelEl === safetyModelSelect || modelEl === modelSelect) && providerEl.value === "gemini") {
        modelEl.value = "gemini-3-flash-preview";
      } else if ((modelEl === safetyModelSelect || modelEl === modelSelect) && providerEl.value === "ali") {
        modelEl.value = "qwen3.6-flash";
      } else if ((modelEl === safetyModelSelect || modelEl === modelSelect) && providerEl.value === "qiniu") {
        modelEl.value = "google/gemini-3.5-flash";
      }
    }
    (async () => {
      const r = await fetch("/api/models");
      providerModels = (await r.json()).provider_models || {};
      fillModelSelect(providerSelect, modelSelect);
      fillModelSelect(safetyProviderSelect, safetyModelSelect);
    })();
    providerSelect.addEventListener("change", () => {
      fillModelSelect(providerSelect, modelSelect);
    });
    safetyProviderSelect.addEventListener("change", () => {
      fillModelSelect(safetyProviderSelect, safetyModelSelect);
    });

    /* tabs */
    document.querySelectorAll(".approach-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".approach-tab").forEach(t=>t.classList.remove("active"));
        document.querySelectorAll(".approach-content").forEach(c=>c.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(tab.dataset.tab).classList.add("active");
      });
    });

    const COLOR_NAMES = {
      voltage_regulator:"调压器(黄)", heating_unit:"加热装置(红)", distillation_core:"蒸馏核心(绿)",
      condenser_unit:"冷凝管(蓝)", receiving_assembly:"接收装置(橙)", vacuum_gauge:"真空表(紫)",
      light_spot:"光斑(红)",
    };

    function renderTimings(sel, timings) {
      const tbody = document.querySelector(sel + " tbody");
      tbody.innerHTML = "";
      const maxMs = Math.max(...Object.values(timings), 1);
      for (const [name, ms] of Object.entries(timings)) {
        const barW = Math.max(2, Math.round(ms / maxMs * 120));
        tbody.innerHTML += `<tr><td>${name}</td><td>${ms.toFixed(0)} ms <span class="timing-bar" style="width:${barW}px"></span></td></tr>`;
      }
    }

    function renderDetections(summary) {
      const tbody = document.querySelector("#detectionTable tbody");
      tbody.innerHTML = "";
      for (const [label, info] of Object.entries(summary || {})) {
        const ok = '<span style="color:var(--ok)">✓</span>';
        const bad = '<span style="color:var(--bad)">✗</span>';
        let note = "";
        if (info.in_wrong && info.wrong_score != null) note = `score=${info.wrong_score.toFixed(3)}`;
        if (!info.in_wrong && info.wrong_failure_reason) note = info.wrong_failure_reason;
        tbody.innerHTML += `<tr><td>${COLOR_NAMES[label] || label}</td><td>${info.in_correct ? ok : bad}</td><td>${info.in_wrong ? ok : bad}</td><td style="font-size:.82rem;color:var(--muted)">${note}</td></tr>`;
      }
    }

    /* ---- 检测 + 单次 VLM 提交流程 ---- */
    mainForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (experimentType.value === "electrolysis") {
        statusEl.textContent = "正在检索参考样例并分析...";
        runButton.disabled = true;
        detectArea.hidden = true;
        analyzeArea.hidden = false;
        analyzeStatus.textContent = "正在 VLM 分析...";
        document.querySelector('[data-tab="tabA"]').hidden = false;
        document.querySelector('[data-tab="tabA"]').classList.add("active");
        document.getElementById("tabA").classList.add("active");
        document.querySelector('[data-tab="tabB"]').hidden = true;
        document.getElementById("tabB").classList.remove("active");
        try {
          const resp = await fetch("/api/electrolysis/check", { method: "POST", body: new FormData(mainForm) });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.error || "电解实验纠错失败");
          document.getElementById("resultA").textContent = data.analysis_text || "无结果";
          renderTimings("#analyzeTiming", data.timings || {});
          analyzeStatus.textContent = "VLM 分析完成。";
          statusEl.textContent = "全部完成。";
        } catch (err) {
          statusEl.textContent = err.message;
          analyzeStatus.textContent = "分析失败";
        } finally {
          runButton.disabled = false;
        }
        return;
      }

      // 未接入的实验直接忽略
      if (!["distillation", "photometer"].includes(experimentType.value)) {
        statusEl.textContent = "该实验模块尚未实现。";
        return;
      }

      statusEl.textContent = "正在 CV 检测...";
      runButton.disabled = true;
      detectArea.hidden = true;
      analyzeArea.hidden = true;

      try {
        const fd = new FormData(mainForm);
        let resp = await fetch("/api/detect", { method: "POST", body: fd });
        let data = await resp.json();
        if (!resp.ok) throw new Error(data.error);

        document.getElementById("correctImage").src = data.correct_data_url;
        document.getElementById("wrongImage").src = data.wrong_data_url;
        detectArea.hidden = false;
        renderTimings("#detectTiming", data.timings || {});
        renderDetections(data.label_summary);
        statusEl.textContent = "检测完成，正在 VLM 分析...";

        analyzeArea.hidden = false;
        document.querySelector('[data-tab="tabA"]').hidden = false;
        document.querySelector('[data-tab="tabA"]').classList.add("active");
        document.getElementById("tabA").classList.add("active");
        document.querySelector('[data-tab="tabB"]').hidden = true;
        document.getElementById("tabB").classList.remove("active");
        fd.append("session_id", data.session_id);
        resp = await fetch("/api/analyze", { method: "POST", body: fd });
        data = await resp.json();
        if (!resp.ok) throw new Error(data.error);

        if (data.approach_a) {
          document.getElementById("resultA").textContent = data.approach_a.analysis_text || "无";
          document.querySelector('[data-tab="tabA"]').hidden = false;
        } else document.querySelector('[data-tab="tabA"]').hidden = true;

        if (data.approach_b) {
          document.getElementById("resultBDiff").textContent = data.approach_b.diff_text || "无";
          document.getElementById("resultBAnalysis").textContent = data.approach_b.analysis_text || "无";
          document.querySelector('[data-tab="tabB"]').hidden = false;
        } else document.querySelector('[data-tab="tabB"]').hidden = true;

        renderTimings("#analyzeTiming", data.timings || {});
        analyzeStatus.textContent = "VLM 分析完成。";
        statusEl.textContent = "全部完成。";
      } catch (err) {
        statusEl.textContent = err.message;
        analyzeStatus.textContent = "分析失败";
      } finally {
        runButton.disabled = false;
      }
    });

    safetyForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      safetyStatus.textContent = "正在检查...";
      safetyRunButton.disabled = true;
      detectArea.hidden = true;
      analyzeArea.hidden = true;
      safetyResultsArea.hidden = true;

      try {
        const resp = await fetch("/api/safety/check", { method: "POST", body: new FormData(safetyForm) });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || "检查失败");

        document.getElementById("safetyResultText").textContent = data.analysis_text || data.error || "无结果";
        renderTimings("#safetyTiming", data.timings || {});
        safetyResultsArea.hidden = false;
        safetyStatus.textContent = data.error ? data.error : "检查完成。";
      } catch (err) {
        safetyStatus.textContent = err.message;
      } finally {
        safetyRunButton.disabled = false;
      }
    });

    applyModuleMode();
  </script>
  <script src="{{ url_for('static', filename='pku-callback.js') }}"></script>
</body>
</html>
