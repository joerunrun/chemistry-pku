# HTTPS placeholder only: domain / certificate / private key = TODO.
# Keep HTTP until a real trusted certificate and client configuration are ready.
# Do not log query strings containing IAAA callback tokens.
log_format chem_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log chem_safe;

    client_max_body_size 100m;
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location /static-videos/ {
        return 410;
    }

    location / {
        proxy_pass http://chemistry-api:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
