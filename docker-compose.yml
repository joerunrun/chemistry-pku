version: "3.8"

services:
  chemistry-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chemistry-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHEM_RUNTIME_ASSETS_DIR: /app/runtime_assets
    volumes:
      - ./runtime_assets:/app/runtime_assets:ro
    expose:
      - "5080"

  nginx:
    image: nginx:1.27-alpine
    container_name: chemistry-nginx
    restart: unless-stopped
    depends_on:
      - chemistry-api
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/chemistry.conf:/etc/nginx/conf.d/default.conf:ro
